[project]
name = "codependentcodr"
version = "0.1.0"
description = "Source for www.codependentcodr.com, built with Pelican"
readme = "Readme.md"
requires-python = "==3.15.*"
# These are minimums only. uv.lock records the exact versions used by both
# local builds and the deploy image (see Dockerfile), so changing the lock
# (e.g. `make update-dependencies`) changes what production uses.
dependencies = [
    "markdown>=3.10.3",
    "pelican>=4.11.0",
]
# The AWS CLI used for the S3 upload is deliberately not listed here: its
# docutils requirement conflicts with Pelican's. The Dockerfile installs it
# into its own isolated environment instead.

[tool.uv]
# This is a site, not an installable package
package = false
